<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Consulta de Placa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f0f0f0;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    .resultado {
      margin-top: 20px;
      background: #e8f5e9;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Consulta de Veículo por Placa</h2>
    <input type="text" id="placa" placeholder="Digite a placa (ex: ABC1234)">
    <button onclick="consultarPlaca()">Consultar</button>
    <div id="resultado" class="resultado"></div>
  </div>

  <script>
    function consultarPlaca() {
      const placa = document.getElementById('placa').value.toUpperCase();
      const url = `https://apicarros.com/v1/consulta/${placa}/json`;

      document.getElementById('resultado').innerText = 'Consultando...';

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.erro) {
            document.getElementById('resultado').innerText = 'Placa não encontrada ou erro na consulta.';
          } else {
            document.getElementById('resultado').innerHTML = `
              <strong>Placa:</strong> ${data.placa}<br>
              <strong>Modelo:</strong> ${data.modelo}<br>
              <strong>Ano:</strong> ${data.ano}<br>
              <strong>UF:</strong> ${data.uf}<br>
              <strong>Cidade:</strong> ${data.cidade}<br>
              <strong>Situação:</strong> ${data.situacao}
            `;
          }
        })
        .catch(() => {
          document.getElementById('resultado').innerText = 'Erro ao consultar a API.';
        });
    }
  </script>
</body>
</html>
